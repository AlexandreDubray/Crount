[package]
name = "crount"
version = "0.0.1"
edition = "2024"

authors = ["Alexandre Dubray <alexandre.dubray@outlook.com>"]
readme = "README.md"
repository = "https://github.com/AlexandreDubray/Crount"
description = "A model counter written in Rust"
license = "MIT"
exclude = ["tests"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustc-hash = ">=1.1.0"
clap = { version = ">=4.4.7", features = ["derive"] }
assert_float_eq = ">=1.1.3"
rand = ">=0.8.5"
sysinfo = ">=0.28.1"
search_trail = ">=0.1.3"
peak_alloc = ">=0.2.0"
chrono = ">=0.4.31"
rayon = ">=1.8.0"
malachite = ">=0.9.0"

[dev-dependencies]
paste = "1.0.12"
tempfile = "3"
